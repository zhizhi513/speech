    <style>
:root{
  --bg:#fafaf7;
  --surface:#ffffff;
  --surface-soft:#f5f4ef;
  --surface-hover:#eeece5;
  --text:#1a1a1a;
  --text-muted:#6b6b6b;
  --text-dim:#9b9b9b;
  --accent:#d97757;
  --accent-hover:#c66643;
  --accent-soft:#fef3ec;
  --border:#e6e3da;
  --border-strong:#d4d0c4;
  --success:#3a8c5a;
  --success-soft:#e8f3ec;
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:24px;
  --shadow:0 1px 3px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --shadow-lg:0 4px 12px rgba(0,0,0,.08), 0 24px 60px rgba(0,0,0,.10);
  --sans:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Noto Serif SC",serif;
}
*{box-sizing:border-box}
html,body,#root{min-height:100svh;margin:0}
body{font:16px/1.55 var(--sans);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
#root{flex-direction:column;align-items:center;padding:32px 24px 48px;display:flex;position:relative}
.app{flex-direction:column;align-items:stretch;width:100%;max-width:820px;display:flex}
header{text-align:center;margin-bottom:28px}
.brand{font-family:var(--serif);letter-spacing:-.02em;margin:0 0 6px;font-size:2.2rem;font-weight:700;color:var(--text)}
.credit{color:var(--text-muted);font-size:.88rem;margin:0}

.nav{display:flex;gap:4px;background:var(--surface-soft);border-radius:var(--radius-lg);padding:4px;margin-bottom:24px;border:1px solid var(--border)}
.nav-btn{flex:1;appearance:none;background:transparent;border:none;color:var(--text-muted);font-family:var(--sans);font-size:.92rem;font-weight:600;padding:10px 16px;border-radius:var(--radius-md);cursor:pointer;transition:all .15s}
.nav-btn:hover{color:var(--text);background:var(--surface-hover)}
.nav-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06)}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow)}

.cat-picker{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.cat-picker-header{justify-content:space-between;align-items:center;display:flex}
.cat-picker-title{font-size:.72rem;font-weight:700;color:var(--accent);letter-spacing:.16em;text-transform:uppercase}
.cat-chips{flex-wrap:wrap;gap:8px;display:flex}
.chip{appearance:none;color:var(--text-muted);font-family:var(--sans);background:var(--surface);border:1px solid var(--border);border-radius:999px;cursor:pointer;align-items:center;gap:6px;padding:7px 14px;font-size:.85rem;font-weight:500;transition:all .15s;display:inline-flex}
.chip:hover:not(:disabled){background:var(--surface-soft);color:var(--text);border-color:var(--border-strong)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip:disabled{opacity:.45;cursor:not-allowed}

.stage{text-align:center;padding:40px 20px;margin-bottom:16px;background:var(--surface-soft);border-radius:var(--radius-lg);border:1px solid var(--border)}
.status-label{letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 16px;font-size:.72rem;font-weight:700}
.topic-title{font-family:var(--serif);letter-spacing:-.02em;color:var(--text);margin:0 0 14px;font-size:clamp(2rem,6vw,3rem);font-weight:700;line-height:1.2;word-break:break-word}
.topic-hint{color:var(--text-muted);font-size:clamp(.95rem,2.4vw,1.08rem);line-height:1.55;margin:0 auto;max-width:520px}
.topic-display{font-family:var(--serif);color:var(--text-dim);margin:0;font-size:1.4rem;font-weight:500}
.topic-display.spinning{animation:.12s infinite alternate pulseBlur}
@keyframes pulseBlur{0%{opacity:.72;filter:blur(.5px);transform:scale(.985)}to{opacity:1;filter:blur(0);transform:scale(1)}}

/* ────── 手机端适配 ────── */
@media (max-width: 720px) {
  body { font-size: 16px; }
  .app { padding: 14px 16px max(20px, env(safe-area-inset-bottom)) 16px; }
  .header { flex-direction: column; align-items: stretch; gap: 10px; padding-top: max(8px, env(safe-area-inset-top)); }
  .header .brand-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .header .credit { font-size: .75rem; }
  .header h1.brand { font-size: 1.45rem; }
  .tab-row { gap: 6px; }
  .tab { padding: 10px 12px; font-size: .9rem; flex: 1; text-align: center; }
  .card { padding: 18px 16px; border-radius: 14px; }
  .topic-title { font-size: 1.7rem !important; }
  .topic-hint { font-size: .9rem !important; }
  .btn { padding: 14px 18px; font-size: 1rem; min-height: 48px; }  /* iOS 手指点击区 */
  .timer { font-size: 2.4rem !important; }
  .lib-grid { gap: 6px; }
  .lib-pill { padding: 12px 8px; font-size: .8rem; }
  .lib-pill .lib-meta { font-size: .65rem; }
  .score-pill { padding: 10px 14px; font-size: .88rem; }
  .modal { padding: 20px 18px; border-radius: 18px; width: 96vw; max-height: 92vh; }
  .modal h2 { font-size: 1.1rem; }
  .field textarea, .field input { font-size: 16px !important; } /* iOS 防止点击输入框放大 */
  .stats { grid-template-columns: 1fr 1fr 1fr !important; gap: 8px !important; }
  .stat-num { font-size: 1.4rem !important; }
  .history-card { padding: 12px 14px; }
  .history-meta { flex-wrap: wrap; gap: 6px; }
  .footer { font-size: .7rem; }
  .settings-panel { padding: 18px; }
}
/* 防止 iOS 长按选中 */
* { -webkit-tap-highlight-color: rgba(217, 119, 87, 0.18); -webkit-touch-callout: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
button { -webkit-user-select: none; user-select: none; }
/* 超小屏优化 (320px 以下) */
@media (max-width: 380px) {
  .topic-title { font-size: 1.4rem !important; }
  .stats { grid-template-columns: 1fr !important; }
  .score-pill { flex: 1 0 40%; }
}

.timer{display:flex;flex-direction:column;align-items:center;gap:8px;margin:12px 0 24px}
.timer-text{font-family:var(--serif);font-variant-numeric:tabular-nums;color:var(--accent);font-size:2.8rem;font-weight:600;letter-spacing:-.02em}
.timer-label{font-size:.72rem;font-weight:700;color:var(--text-muted);letter-spacing:.16em;text-transform:uppercase}

.actions{flex-wrap:wrap;justify-content:center;gap:10px;display:flex}
.btn{appearance:none;font-family:var(--sans);border-radius:var(--radius-md);cursor:pointer;border:none;justify-content:center;align-items:center;gap:8px;padding:11px 22px;font-size:.92rem;font-weight:600;transition:all .15s;display:inline-flex}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-hover)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--surface-soft);border-color:var(--border-strong)}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.btn-ghost:hover:not(:disabled){background:var(--surface-soft);color:var(--text)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover:not(:disabled){background:#347a4f}

/* ────── 复盘评分胶囊 ────── */
.score-grid{display:flex;flex-wrap:wrap;gap:6px}
.score-pill{appearance:none;font-family:var(--sans);background:var(--surface);color:var(--text-muted);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .15s}
.score-pill:hover{border-color:var(--accent);color:var(--accent)}
.score-pill.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.score-stat{font-size:1.05rem !important;line-height:1.3}

.hint{color:var(--text-muted);text-align:center;font-size:.9rem;margin:0 0 20px}

/* ────── 复盘弹窗 ────── */
.modal-backdrop{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .2s;display:grid;place-items:center;position:fixed;inset:0}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:min(92vw,560px);max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);padding:28px;transform:translateY(8px)scale(.99);transition:transform .2s}
.modal-backdrop.open .modal{transform:translateY(0)scale(1)}
.modal h2{font-family:var(--serif);margin:0 0 6px;font-size:1.4rem;font-weight:700}
.modal-topic{color:var(--text-muted);margin:0 0 20px;font-size:.9rem}
.modal-topic strong{color:var(--text);font-weight:600}
.field{margin-bottom:14px}
.field label{display:block;font-size:.78rem;font-weight:600;color:var(--text-muted);margin-bottom:6px;letter-spacing:.04em}
.field textarea{width:100%;font-family:var(--sans);font-size:.95rem;line-height:1.55;color:var(--text);background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;resize:vertical;min-height:80px;transition:border-color .15s}
.field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.modal-actions{justify-content:flex-end;gap:10px;margin-top:20px;display:flex}

/* ────── 历史记录 ────── */
.history-list{display:flex;flex-direction:column;gap:12px}
.history-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;transition:border-color .15s;cursor:pointer}
.history-item:hover{border-color:var(--border-strong)}
.history-item-head{justify-content:space-between;align-items:flex-start;margin-bottom:8px;display:flex;gap:12px}
.history-topic{font-family:var(--serif);font-size:1.05rem;font-weight:600;color:var(--text);margin:0}
.history-date{color:var(--text-dim);font-size:.78rem;white-space:nowrap}
.history-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.history-meta-tag{background:var(--surface-soft);color:var(--text-muted);font-size:.72rem;padding:2px 8px;border-radius:999px;font-weight:500}
.history-snippet{color:var(--text-muted);font-size:.88rem;line-height:1.5;margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.history-actions{justify-content:flex-end;gap:8px;margin-top:10px;display:flex}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty-state-icon{font-size:2rem;margin-bottom:12px;opacity:.5}
.empty-state-text{font-size:.95rem;margin:0}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface-soft);border-radius:var(--radius-md);padding:14px;text-align:center}
.stat-num{font-family:var(--serif);font-size:1.6rem;font-weight:700;color:var(--accent);margin:0;line-height:1}
.stat-label{font-size:.78rem;color:var(--text-muted);margin:6px 0 0;letter-spacing:.04em}

@media (max-width:560px){.brand{font-size:1.8rem}.panel{padding:18px}.stage{padding:28px 16px}.stats-row{grid-template-columns:1fr}}
    </style>

  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useState, useEffect, useRef, useMemo } from 'https://esm.sh/react@18.3.1';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';

      // ────────────────────────── 词库（分组）─────────────────────────

      // ===== O米补丁: GitHub history 同步 + 答案按需加载 =====
      const OMI_PAT = localStorage.getItem("omi_pat") || ""; /* 首次打开会弹窗要求填 PAT */
      const OMI_REPO = "zhizhi513/speech-data";
      const OMI_HIST = "history.json";
      const OMI_API = "https://api.github.com";
      const OMI_BASE = "https://zhizhi513.github.io/speech/answers/";

      function omiFile(id){ return encodeURIComponent(id + ".md"); }

      function omiRender(md){
        const e = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
        let h = e(md);
        h = h.replace(/^### (.+)$/gm, "<h4>$1</h4>");
        h = h.replace(/^## (.+)$/gm, "<h3>$1</h3>");
        h = h.replace(/^# (.+)$/gm, "<h2>$1</h2>");
        h = h.replace(/^> (.+)$/gm, "<blockquote>$1</blockquote>");
        h = h.replace(/**(.+?)**/g, "<strong>$1</strong>");
        h = h.replace(/^---$/gm, "<hr/>");
        h = h.replace(/

/g, "<br/><br/>");
        h = h.replace(/
/g, "<br/>");
        return h;
      }

      let omiSyncT = null, omiSyncD = null;
      async function omiSync(hist){
        if(omiSyncT) clearTimeout(omiSyncT);
        omiSyncD = hist;
        return new Promise(r => {
          omiSyncT = setTimeout(async () => {
            const data = omiSyncD;
            try {
              const g = await fetch(OMI_API + "/repos/" + OMI_REPO + "/contents/" + OMI_HIST, {
                headers: { "Authorization": "token " + OMI_PAT, "User-Agent": "speech" }
              });
              let sha = null;
              if(g.ok){ sha = (await g.json()).sha; }
              const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
              const body = { message: "upd " + new Date().toISOString(), content, sha: sha||undefined };
              const p = await fetch(OMI_API + "/repos/" + OMI_REPO + "/contents/" + OMI_HIST, {
                method: "PUT",
                headers: { "Authorization": "token " + OMI_PAT, "Content-Type": "application/json", "User-Agent": "speech" },
                body: JSON.stringify(body)
              });
              if(p.ok) console.log("✅ synced"); else console.warn("❌", await p.text());
              r(p.ok);
            } catch(e){ console.warn("sync err:", e.message); r(false); }
          }, 1500);
        });
      }

      async function omiBoot(){
        try {
          const r = await fetch(OMI_API + "/repos/" + OMI_REPO + "/contents/" + OMI_HIST, {
            headers: { "Authorization": "token " + OMI_PAT, "User-Agent": "speech" }
          });
          if(!r.ok) return null;
          const meta = await r.json();
          const txt = decodeURIComponent(escape(atob(meta.content.replace(/
/g,""))));
          return JSON.parse(txt);
        } catch(e){ return null; }
      }

      async function omiShowAns(id, btn){
        const cached = localStorage.getItem("ans:" + id);
        let md = cached;
        if(!md){
          btn.disabled = true; btn.textContent = "加载中…";
          try {
            const r = await fetch(OMI_BASE + omiFile(id));
            if(!r.ok) throw new Error("HTTP " + r.status);
            md = await r.text();
            localStorage.setItem("ans:" + id, md);
          } catch(e){
            btn.disabled = false; btn.textContent = "📖 标准答案（重试）";
            alert("加载失败：" + e.message + "\n\n网络问题或文件不存在");
            return;
          }
          btn.disabled = false; btn.textContent = "📖 标准答案";
        }
        const w = window.open("", "_blank", "width=600,height=720");
        if(!w){ alert("浏览器拦截了弹窗，请允许弹窗"); return; }
        w.document.write("<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>" + id + " - 标准答案</title><style>body{font-family:-apple-system,system-ui,sans-serif;max-width:680px;margin:24px auto;padding:0 20px;line-height:1.8;color:#1a1a1a;background:#fafaf7;}h2{color:#d97757;}h3,h4{color:#9b9b9b;margin-top:1.5em;}blockquote{border-left:3px solid #d97757;padding:8px 14px;color:#6b6b6b;background:#f5f4ef;margin:12px 0;}strong{color:#1a1a1a;}hr{border:none;border-top:1px dashed #d4d0c4;margin:24px 0;}a{color:#d97757;}</style></head><body>" + omiRender(md) + "</body></html>");
        w.document.close();
      }

      const LIBRARIES = [
        {
          id: 'ai', name: '人工智能', icon: '✦',
          topics: [
            '提示工程 | 怎么和 AI 说话的技巧。',
            'RAG 检索增强 | 先查资料再回答，减少胡说。',
            'AI Agent | 能自己拆任务、用工具的 AI。',
            '多模态模型 | 同时处理文字图片语音视频的 AI。',
            '模型微调 | 用特定数据把通用模型练成专家。',
            '向量数据库 | 按语义而非关键词检索的数据库。',
            '幻觉问题 | AI 一本正经地胡说八道。',
            '模型蒸馏 | 把大模型的能力压到小模型。',
            '思维链推理 | 让 AI 一步步思考再给答案。',
            '函数调用 | AI 主动调用外部工具完成任务。',
            'AI 代码助手 | Copilot 这类帮人写代码的 AI。',
            '具身智能 | 拥有身体、会动手的 AI。',
            '强化学习 | 通过试错和奖惩学会决策。',
            '对齐问题 | 让 AI 目标和人类一致。',
            '人脸识别 | 用脸做身份验证的技术。',
            '推荐算法 | 抖音淘宝猜你喜欢背后的逻辑。',
            '自动驾驶 | 让汽车自己开的技术。',
            '智能家居 | 全屋联网一句话控制家电。',
            '机器人 | 能自主行动的智能机器。',
            '无人机 | 无人驾驶的飞行器。',
            '虚拟现实 | VR 头显里的沉浸世界。',
            'AI 换脸 | 把视频里人的脸换成别人。',
            'AI 诈骗 | 用 AI 模仿声音和脸骗钱。',
            '语音合成 | 把文字变成人声的 AI。',

            '元学习 | 让 AI 学会怎么学习。',
            '奖励黑客 | AI 钻空子拿奖励不走正路。'

        },
        {
          id: 'cs', name: '计算机技术', icon: '⌘',
          topics: [
            '云计算 | 把服务器放云上，按需租用。',
            '区块链 | 链式结构、不可篡改的分布式账本。',

            '消息队列 | 让系统之间异步通信的中间件。',
            'CDN 内容分发 | 把内容缓存到离用户近的节点。',
            'Kubernetes | 自动管理容器的编排平台。',
            'CQRS | 读写分离架构，查询和命令分两套。',
            'PostgreSQL | 功能强大的开源关系数据库。',
            'Redis | 内存数据库，常用于缓存。',
            'Kafka | 高吞吐量的消息流处理平台。',
            'gRPC | 高性能的远程调用框架。',
            '服务网格 | 微服务之间通信的基础设施层。',
            '可观测性 | 用日志、指标、链路监控系统。',
            '边缘计算 | 把计算推到离用户近的地方。',
            '缓存策略 | 决定什么数据缓存在哪里。',
            'CI/CD | 持续集成持续部署，自动化上线。',
            '负载均衡 | 把请求分给多台服务器。',

          const g = audioCtx.createGain();
          o.frequency.value = freq;
          o.type = 'sine';
          g.gain.setValueAtTime(0.15, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(); o.stop(audioCtx.currentTime + dur);

                reviewing.hint ? ' — ' + reviewing.hint : ''
              ),
              React.createElement('div', { className: 'field' },
                React.createElement('label', null, '本次表现评分'),
                React.createElement('div', { className: 'score-grid' },
                  [
                    { v: 7, label: '夯爆了' },
                    { v: 6, label: '夯' },
                    { v: 5, label: '顶级' },
                    { v: 4, label: '人上人' },
                    { v: 3, label: 'NPC' },
                    { v: 2, label: '拉完了' },
                    { v: 1, label: '拉中拉之拉一裤兜' }
                  ].map(opt => {
                    const cur = reviewing?.score ?? editingReview?.score ?? 0;
                    const active = opt.v === cur;
                    return React.createElement('button', {
                      key: opt.v,
                      className: 'score-pill ' + (active ? 'on' : ''),
                      onClick: () => {
                        if(reviewing) setReviewing({ ...reviewing, score: opt.v });
                        else setEditingReview({ ...editingReview, score: opt.v });
                      }
                    }, opt.label);
                  })
                )
              ),
              React.createElement('div', { className: 'field' },
                React.createElement('label', null, '💡 一个核心收获（讲完后你印象最深的一点）'),
                React.createElement('textarea', {
                  placeholder: '例如：原来锚定效应的本质是先入为主的认知偏差，应用到面试中……',
                  value: reviewing?.takeaway ?? editingReview?.takeaway ?? '',
                  onChange: e => {
                    if(reviewing) setReviewing({ ...reviewing, takeaway: e.target.value });
                    else setEditingReview({ ...editingReview, takeaway: e.target.value });
                  }
                })
              ),
              React.createElement('div', { className: 'field' },
                React.createElement('label', null, '📝 复盘笔记（哪里讲得好/哪里卡壳/下次怎么改）'),
                React.createElement('textarea', {
                  placeholder: '例如：开头讲得太啰嗦，应该直接给定义；例子「寿光蔬菜滞销」讲得太细，超时了。',
                  rows: 4,
                  value: reviewing?.note ?? editingReview?.note ?? '',
                  onChange: e => {
                    if(reviewing) setReviewing({ ...reviewing, note: e.target.value });
                    else setEditingReview({ ...editingReview, note: e.target.value });
                  }
                })
              ),
              React.createElement('div', { className: 'modal-actions' },
                React.createElement('button', {
                  className: 'btn btn-ghost',
                  onClick: () => { setReviewing(null); setEditingReview(null); }
                }, '取消'),
                React.createElement('button', {
                  className: 'btn btn-primary',
                  onClick: () => {
                    if(reviewing){
                      if(!reviewing.takeaway.trim() && !reviewing.note.trim()){
                        if(!confirm('收获和复盘都是空的，确定保存吗？')) return;
                      }
                      saveReview(reviewing);
                    } else {
                      // 更新已存在的
                      const old = editingReview;
                      setHistory(prev => {
                        const list = prev[old.topicId] || [];
                        const next = list.map(r => r.date === old.date ? { ...old } : r);
                        return { ...prev, [old.topicId]: next };
                      });
                      setEditingReview(null);
                    }
                  }
                }, '保存复盘')
              )
            )
          )
          : null;

        // ────────────── Settings Modal ──────────────
        const SettingsModal = settingsOpen
          ? React.createElement('div', {
              className: 'modal-backdrop open',
              onClick: e => { if(e.target === e.currentTarget) setSettingsOpen(false); }
            },
            React.createElement('div', { className: 'modal' },
              React.createElement('h2', null, '设置'),
              React.createElement('p', { className: 'modal-topic' }, '准备时间和演讲时间'),
              React.createElement('div', { className: 'field' },
                React.createElement('label', null, '准备时间（分钟）'),
                React.createElement('input', {
                  type: 'range', min: 1, max: 60, step: 1, value: settings.prepMinutes,
                  onChange: e => setSettings(s => ({ ...s, prepMinutes: +e.target.value }))
                }),
                React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: '.8rem', color: 'var(--text-dim)', marginTop: 6 } },
                  React.createElement('span', null, '1 分钟'),
                  React.createElement('span', null, settings.prepMinutes + ' 分钟'),
                  React.createElement('span', null, '60 分钟')
                )
              ),
              React.createElement('div', { className: 'field' },
                React.createElement('label', null, '演讲时间固定为 60 秒（不可调）')
              ),
              React.createElement('div', { className: 'field' },
                React.createElement('label', { style: { display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' } },
                  React.createElement('input', {
                    type: 'checkbox', checked: !settings.muted,
                    onChange: e => setSettings(s => ({ ...s, muted: !e.target.checked }))
                  }),
                  React.createElement('span', null, '启用提示音效')
                )
              ),
              React.createElement('div', { className: 'modal-actions' },
                React.createElement('button', { className: 'btn btn-primary', onClick: () => setSettingsOpen(false) }, '完成')
              )
            )
          )
          : null;

        return React.createElement('div', { className: 'app' },
          React.createElement('header', null,
            React.createElement('h1', { className: 'brand' }, 'Speech'),
            React.createElement('p', { className: 'credit' }, '即兴演讲练习')
          ),

          React.createElement('nav', { className: 'nav', 'aria-label': '视图切换' },
            React.createElement('button', {
              className: 'nav-btn' + (view === 'practice' ? ' active' : ''),
              onClick: () => setView('practice')
            }, '🎤 练习'),
            React.createElement('button', {
              className: 'nav-btn' + (view === 'history' ? ' active' : ''),
              onClick: () => setView('history')
            }, `📒 复盘记录${totalCount > 0 ? ' · ' + totalCount : ''}`)
          ),

          React.createElement('main', { className: 'panel' },
            view === 'practice' ? PracticeView : HistoryView
          ),

          ReviewModal,
          SettingsModal
        );
      }

      createRoot(document.getElementById('root')).render(React.createElement(App));

      // 注册 Service Worker（手机离线可用 + PWA）
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
